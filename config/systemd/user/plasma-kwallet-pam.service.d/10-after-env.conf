# plasma-kwallet-pam.service runs pam_kwallet_init, which pipes the session
# environment into $PAM_KWALLET5_LOGIN -- the socket pam_kwallet5 opened at
# login, where ksecretd is blocked waiting for it before it opens the wallet
# and takes org.freedesktop.secrets.
#
# The stock unit orders itself After=plasma-kwin_wayland.service, which does not
# exist under Hyprland, so nothing held it back and it ran too early, twice over:
#
#   1. Before wayland-wm-env@ imported the login environment into the systemd
#      user manager (12:20:55.591 vs .592, 2026-09-17), so PAM_KWALLET5_LOGIN was
#      unset; pam_kwallet_init only runs socat when that variable is set, so it
#      exited silently and ksecretd sat on its socket for the whole session.
#   2. With that fixed, before the compositor was up (09:29:16.5 vs .18.8,
#      2026-09-21): ksecretd woke, found WAYLAND_DISPLAY pointing at a socket
#      that did not exist yet, failed the xcb fallback too and SIGABRTed.
#
# Either way the wallet stays locked and every app wanting a secret gets a
# password dialog. wayland-wm@ is Type=notify, so waiting on it means Hyprland
# has signalled ready and its socket is live; it also implies the env preloader,
# which is ordered Before=graphical-session-pre.target. The After= instance
# name is Hyprland-specific and has no effect under Plasma, where the stock
# After=plasma-kwin_wayland.service does the same job. ConditionEnvironment
# below is not session-specific and applies under Plasma too.
#
# ConditionEnvironment turns a future regression into a visibly skipped unit
# instead of a silent no-op.

[Unit]
After=graphical-session-pre.target wayland-wm@hyprland.desktop.service
ConditionEnvironment=PAM_KWALLET5_LOGIN

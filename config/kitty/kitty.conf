include colors.conf
include fonts.conf

enable_audio_bell no
background_opacity 1.0

# Since 0.49 this also remembers the maximize state, so closing a kitty while
# maximized (SUPER+M) made every new kitty open maximized. Hyprland tiles the
# windows anyway, so the remembered size is never useful.
remember_window_size no

# Remote control over a per-instance abstract unix socket ({kitty_pid} gives
# each kitty its own socket). Enables future flicker-free palette switching via
# `kitten @ set-colors`; SIGUSR1 remains the v1 reload path.
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

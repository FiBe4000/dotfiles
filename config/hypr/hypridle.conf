general {
    # --grace: unlock with any input (mouse move >5px / key) within N seconds of
    # locking. CLI-only in hyprlock ≥0.9 (general:grace was removed; --immediate
    # is broken in 0.9.6 — use --grace 0 for an immediate lock instead).
    lock_cmd = pidof hyprlock || hyprlock --grace 10
    before_sleep_cmd = loginctl lock-session
    # Legacy dispatch syntax fails on Lua-config Hyprland (0.55+); fall back to the Lua form.
    after_sleep_cmd = (hyprctl dispatch dpms on || hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'); ~/.dotfiles/scripts/idle-dim restore
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = ~/.dotfiles/scripts/idle-dim dim       # dim backlight (avoid 0 on OLED); saves the real level.
    on-resume = ~/.dotfiles/scripts/idle-dim restore    # restore it (also re-run after dpms on, see below).
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch dpms off || hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'   # screen off when timeout has passed
    on-resume = (hyprctl dispatch dpms on || hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'); ~/.dotfiles/scripts/idle-dim restore   # screen on, then re-apply brightness after the modeset.
}

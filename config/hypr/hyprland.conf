# This is an example Hyprland config file.
# Syntax is the same as in Hypr, but settings might differ.
#
# Refer to the wiki for more information.

# Monitor configuration (desc-based rules + catchall)
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/monitors.conf

input {
    kb_layout=us,se
    kb_variant=
    kb_model=
    kb_options=grp:win_space_toggle,caps:escape
    kb_rules=

    sensitivity=0.3
    follow_mouse=1

    touchpad {
        natural_scroll=true
        tap-to-click=true
        scroll_factor=1.0
    }
}

cursor {
    inactive_timeout=0
}

env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24

general {
    gaps_in=6
    gaps_out=0,12,12,12
    border_size=3
    col.active_border=$accent2
    col.inactive_border=$bg3

    #apply_sens_to_raw=0 # whether to apply the sensitivity to raw input (e.g. used by games where you aim using your mouse)

#damage_tracking=full # leave it on full unless you hate your GPU and want to make it suffer
}

decoration {
    rounding=13
    blur {
        enabled=true
        size=3 # minimum 1
        passes=3 # minimum 1, more passes = more resource intensive.
        new_optimizations=true
    }
    # Your blur "amount" is blur_size * blur_passes, but high blur_size (over around 5-ish) will produce artifacts.
    # if you want heavy blur, you need to up the blur_passes.
    # the more passes, the more you can up the blur_size without noticing artifacts.
}

animations {
    enabled=1
    animation=windows,1,3,default
    animation=border,1,10,default
    animation=fadeIn,1,10,default
    animation=workspaces,1,1,default
}

gestures {
    #workspace_swipe=true
    #workspace_swipe_fingers=3
}

dwindle {
}

misc {
    disable_hyprland_logo=true
    disable_splash_rendering=true
    vrr=1
}

# Don't bitmap-upscale XWayland surfaces on the fractional-scale (1.333x) eDP-1
# panel — that makes Qt4 (Segger Ozone) and other X11 apps look blurry. Apps
# render at native pixels; per-state Xft.dpi in hypr-monitor-hotplug keeps them
# correctly sized (96 docked, 128 undocked).
xwayland {
    force_zero_scaling = true
}
# example window rules
# for windows named/classed as abc and xyz
#windowrule=move 69 420,abc
#windowrule=size 420 69,abc
#windowrule=tile,xyz
#windowrule=float,abc
#windowrule=pseudo,abc
#windowrule=monitor 0,xyz
windowrule = no_blur on, match:title ^()$, match:class ^()$

layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.3, match:namespace rofi
layerrule = animation fadeIn, match:namespace rofi
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.3, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.3, match:namespace swaync-control-center

bind=SUPERSHIFT,Q,exit,
bind=SUPERCONTROLSHIFT,Q,exec,poweroff
bind=SUPERCONTROLSHIFT,R,exec,reboot
bind=CONTROLALT,L,exec,hyprlock
bind=SUPERSHIFTENTER,RETURN,exec,kitty
bind=SUPER,C,killactive,
bind=SUPERSHIFT,C,exec,hyprctl activewindow -j | jq -r '.pid' | xargs kill -9
bind=SUPER,E,exec,dolphin
bind=SUPER,S,setfloating,
bind=SUPER,T,settiled
bind=SUPER,F,fullscreen,0
bind=SUPER,M,fullscreen,1
bind=SUPER,P,exec,rofi -show drun
bind=SUPERSHIFT,D,exec,~/.dotfiles/scripts/hypr-toggle-laptop-display

bind=SUPER,H,movefocus,l
bind=SUPER,L,movefocus,r
bind=SUPER,K,movefocus,u
bind=SUPER,J,movefocus,d

bind=SUPERSHIFT,H,movewindow,l
bind=SUPERSHIFT,L,movewindow,r
bind=SUPERSHIFT,K,movewindow,u
bind=SUPERSHIFT,J,movewindow,d

bindm=SUPER,mouse:272,movewindow
bindm=SUPER,mouse:273,resizewindow

bind=SUPER,1,focusworkspaceoncurrentmonitor,1
bind=SUPER,2,focusworkspaceoncurrentmonitor,2
bind=SUPER,3,focusworkspaceoncurrentmonitor,3
bind=SUPER,4,focusworkspaceoncurrentmonitor,4
bind=SUPER,5,focusworkspaceoncurrentmonitor,5
bind=SUPER,6,focusworkspaceoncurrentmonitor,6
bind=SUPER,7,focusworkspaceoncurrentmonitor,7
bind=SUPER,8,focusworkspaceoncurrentmonitor,8
bind=SUPER,9,focusworkspaceoncurrentmonitor,9
bind=SUPER,0,focusworkspaceoncurrentmonitor,10

bind=SUPERSHIFTENTER,1,movetoworkspacesilent,1
bind=SUPERSHIFTENTER,2,movetoworkspacesilent,2
bind=SUPERSHIFTENTER,3,movetoworkspacesilent,3
bind=SUPERSHIFTENTER,4,movetoworkspacesilent,4
bind=SUPERSHIFTENTER,5,movetoworkspacesilent,5
bind=SUPERSHIFTENTER,6,movetoworkspacesilent,6
bind=SUPERSHIFTENTER,7,movetoworkspacesilent,7
bind=SUPERSHIFTENTER,8,movetoworkspacesilent,8
bind=SUPERSHIFTENTER,9,movetoworkspacesilent,9
bind=SUPERSHIFTENTER,0,movetoworkspacesilent,10

bind=,XF86MonBrightnessDown,exec,xbacklight -dec 10 -time 200 -steps 10
bind=,XF86MonBrightnessUp,exec,xbacklight -inc 10 -time 200 -steps 10
bind=SHIFT,XF86MonBrightnessDown,exec,xbacklight -dec 5 -time 200 -steps 10
bind=SHIFT,XF86MonBrightnessUp,exec,xbacklight -inc 5 -time 200 -steps 10

bind=,XF86AudioLowerVolume,exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=,XF86AudioRaiseVolume,exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind=,XF86AudioMute,exec, pactl set-sink-mute @DEFAULT_SINK@ toggle


# Dynamic monitor configuration
# Known monitors use desc: rules (stable across DP port changes)
# Unknown monitors fall through to the catchall

# Catchall — any unrecognized monitor gets native resolution, auto-placed
monitor=,preferred,auto,1

# Built-in laptop panel (eDP-1). The hotplug script disables it when docked and
# re-enables it undocked. Per-machine settings are keyed on the panel's EDID
# desc — a later matching rule overrides the generic eDP-1 rule above it, so
# each laptop only picks up its own line. This file is the SINGLE SOURCE for
# eDP mode/scale: scripts/hypr-display-profile.sh parses the matching monitor=
# line below (eDP-1 for the work laptop, the desc rule for the personal one) to
# derive EDP_MODE/EDP_SCALE/EDP_EXTRA/EDP_DPI for hotplug and toggle. Edit here.

# Work laptop — 2880x1800 120Hz 10-bit panel, 1.333x (default for eDP-1)
monitor=eDP-1,2880x1800@120,auto,1.333333,bitdepth,10

# Personal laptop — AU Optronics 2560x1440 panel, 1.066667x (2400x1350 logical).
# Only blur-free scale between native and 1.25 (fractional-scale protocol
# quantizes to 1/120, so 128/120 is the sole clean divisor in that range).
monitor=desc:AU Optronics 0x2036,2560x1440,auto,1

# Work — Lenovo P24q-10 dual setup (Lindholmen)
monitor=desc:Lenovo Group Limited P24q-10 U4P00001,2560x1440,0x0,1
monitor=desc:Lenovo Group Limited P24q-10 0x01010101,2560x1440,2560x0,1

# Home — Samsung monitors (uncomment and verify desc strings when at home)
#monitor=desc:Samsung Electric Company C27HG7x HTHM400619,2560x1440,-2560x0,1
#monitor=desc:Samsung Electric Company LC27G7xT H4ZN601298,2560x1440,0x0,1

# Route OpenSSH passphrase prompts to a graphical dialog that can remember the
# passphrase in the KDE wallet, so each encrypted key is typed exactly once ever.
#
# Deliberately NOT in zsh/zprofile: environment.d is scoped to the graphical
# session (see 10-ssh-agent.conf), so a VT login or an incoming sshd session
# keeps a working TTY prompt. SSH_ASKPASS_REQUIRE leaves no TTY fallback, so
# that scoping is what makes it safe.

# Arch does not ship /usr/bin/ssh-askpass (the path ksshaskpass's own man page
# claims), so this has to be explicit.
SSH_ASKPASS=/usr/bin/ksshaskpass

# SSH_ASKPASS alone does nothing here: verified against openssh 10.5, with a
# controlling TTY present ssh/ssh-add still prompt on the TTY even when
# SSH_ASKPASS and DISPLAY are set -- i.e. `git push` in a terminal would keep
# asking in-terminal. "prefer" is the minimum that actually routes to the GUI.
# Not "force", which additionally hijacks paths that legitimately read stdin.
#
# Side effect: sshd password prompts and unknown-host-key confirmations also
# become dialogs. ksshaskpass handles both. Escape hatch for a script that
# scrapes those from a pty: SSH_ASKPASS_REQUIRE=never <cmd>.
SSH_ASKPASS_REQUIRE=prefer

# Pin ksshaskpass's storage backend. It caches via QtKeychain, which picks a
# backend from XDG_CURRENT_DESKTOP: "KDE" selects kwallet6, but "Hyprland" falls
# through to the libsecret/Secret-Service backend -- different attribute
# schemas, so a passphrase remembered in one session type is invisible in the
# other. Pinning kwallet6 gives both sessions one shared store, and it is the
# more robust of the two here: org.kde.kwalletd6 has a D-Bus activation file
# whereas org.freedesktop.secrets does not (no gnome-keyring installed), so it
# degrades to a wallet prompt instead of failing outright.
#
# Accepted values are kwallet4|kwallet5|kwallet6|libsecret|gnome. This variable
# is undocumented -- verified by inspecting getKeyringBackend() in
# libqt6keychain.so.1. If passphrases stop being remembered after a
# qtkeychain-qt6 update, re-check this first.
QTKEYCHAIN_BACKEND=kwallet6

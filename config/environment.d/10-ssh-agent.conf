# openssh ships a socket-activated systemd *user* agent
# (/usr/lib/systemd/user/ssh-agent.socket, ListenStream=%t/ssh-agent.socket),
# enabled via the sockets.target.wants symlink that setup.sh creates. The unit
# does not export SSH_AUTH_SOCK itself, hence this file.
#
# environment.d is read by the systemd user manager and applied to all its
# units, which under uwsm includes wayland-wm@hyprland.desktop.service and
# therefore Hyprland and everything it spawns. It does NOT reach TTY logins or
# incoming sshd sessions -- zsh/zprofile covers those.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
